<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 1140}}'>
var CFG = {"toggles": {}, "groups": {}, "ranges": {}, "times": {}, "curve": false};
function hm(v){ var h = Math.floor(v), m = Math.round((v - h) * 60); return (h<10?'0':'')+h+':'+(m<10?'0':'')+m; }
function g(m, mu, sd){ var z = (m - mu) / sd; return Math.exp(-z*z/2); }
class Component extends DCLogic {
  renderVals(){
    var self = this, s = this.state || {}, out = {};
    var ON = 'background:#2A3D60;border-color:#8AA9DE;', OFF = 'background:#0F1A2E;';
    Object.keys(CFG.toggles).forEach(function(k){
      var key = 't_'+k, on = (key in s) ? s[key] : CFG.toggles[k];
      out[key] = {on: on, off: !on, aria: on ? 'true' : 'false', track: on ? 'background:#8AA9DE;' : 'background:#2A3D60;', knob: on ? 'transform:translateX(20px);' : '',
        flip: function(){ var p = {}; p[key] = !on; self.setState(p); }};
    });
    Object.keys(CFG.groups).forEach(function(k){
      var G = CFG.groups[k], key = 'g_'+k, val = (key in s) ? s[key] : G.val;
      out[key] = G.opts.map(function(o){
        var sel = val.indexOf(o.v) >= 0;
        return {t: o.t, pressed: sel, st: sel ? ON : OFF, pick: function(){
          var nv = G.multi ? (sel ? val.filter(function(x){ return x !== o.v; }) : val.concat([o.v])) : [o.v];
          var p = {}; p[key] = nv; var extra = G.sets[o.v] || {};
          Object.keys(extra).forEach(function(r){ p['r_'+r] = extra[r]; });
          self.setState(p);
        }};
      });
      out[key+'_val'] = val;
    });
    Object.keys(CFG.ranges).forEach(function(k){
      var R = CFG.ranges[k], key = 'r_'+k, v = (key in s) ? s[key] : R.v;
      var label = R.fmt === 'h' ? hm(v) : (R.fmt === 'win' ? hm(v)+' to '+hm(v + 3) : (R.fmt === 'min' ? v+' min' : String(v)));
      out[key] = {v: v, label: label, set: function(e){ var p = {}; p[key] = Number(e.target.value); self.setState(p); }};
    });
    Object.keys(CFG.times).forEach(function(k){
      var key = 'tm_'+k, v = (key in s) ? s[key] : CFG.times[k];
      out[key] = {v: v, set: function(e){ var p = {}; p[key] = e.target.value; self.setState(p); }};
    });
    if (CFG.curve) {
      var peak = out.r_peak ? out.r_peak.v : 9;
      var dip = out.t_dip ? out.t_dip.on : true, second = out.t_second ? out.t_second.on : true;
      var c = (peak + 1.5) * 60, pts = [];
      var E = function(m){ var e = 0.15 + 0.75*g(m, c, 95) + (second ? 0.32*g(m, c + 400, 70) : 0) - (dip ? 0.14*g(m, c + 250, 45) : 0) - 0.1*g(m, 22.5*60, 60); return Math.max(0.05, Math.min(1, e)); };
      for (var m = 360; m <= 1380; m += 10) pts.push(((m - 360) / 1020 * 326).toFixed(1)+' '+(104 - E(m) * 94).toFixed(1));
      var line = 'M' + pts.join(' L');
      out.cv = {line: line, area: line + ' L326 110 L0 110 Z', px: ((peak*60 - 360) / 1020 * 326).toFixed(1), pw: (180 / 1020 * 326).toFixed(1),
        summary: 'Deep work '+hm(peak)+' to '+hm(peak + 3)+(dip ? ' · dip after lunch' : '')+(second ? ' · second wind' : '')};
    }
    return out;
  }
}
</script>
